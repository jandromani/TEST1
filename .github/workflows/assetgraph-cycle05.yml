name: AssetGraph Cycle 05B Strict Lab

on:
  push:
    branches: [assetgraph-cycle05-lab]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.3,<9' opencv-python-headless scipy numpy
      - name: Run multi-head memory benchmark
        continue-on-error: true
        run: python .assetgraph-lab/memory_v2_ci.py
      - name: Run strict blind PETS E2E benchmark
        continue-on-error: true
        run: python .assetgraph-lab/pets_e2e_v2_ci.py
      - name: Run AU-AIR sensor-aware benchmark
        continue-on-error: true
        run: python .assetgraph-lab/auair_ci.py
      - name: Write run summary
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.assetgraph-lab/evidence')
          summary={}
          for p in root.glob('*.json'):
              try:
                  d=json.loads(p.read_text())
                  summary[p.name]={
                    'pass_rule':d.get('strict_pass_rule',d.get('component_pass',d.get('pass_rule',d.get('result',{}).get('pass_rule')))),
                    'metrics':d.get('test_metrics',d.get('metrics',d.get('result',{}).get('metrics')))
                  }
              except Exception as e: summary[p.name]={'error':str(e)}
          (root/'cycle05b_summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload AssetGraph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetgraph-cycle05b-evidence
          path: .assetgraph-lab/evidence
          if-no-files-found: warn

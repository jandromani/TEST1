name: AssetGraph Cycle 10 Overhead Training

on:
  push:
    branches: [assetgraph-cycle10-overhead-training]
  workflow_dispatch:

jobs:
  microtrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: pip install 'ultralytics>=8.3,<9' pyyaml requests
      - name: Run deterministic UAV-OBB micro-finetune
        continue-on-error: true
        run: python .assetgraph-lab/uavobb_microtrain_ci.py
      - name: Upload training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetgraph-cycle10-overhead-training
          path: |
            .assetgraph-lab/evidence/uavobb_microtrain.json
            .assetgraph-lab/evidence/uavobb_micro_best.pt
          if-no-files-found: warn

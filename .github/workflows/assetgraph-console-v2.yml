name: AssetGraph Console v2 Real Imagery

on:
  push:
    branches:
      - assetgraph-cycle18b-frozen-intake
    paths:
      - '.assetgraph-lab/build_intelligence_console_v2.py'
      - '.github/workflows/assetgraph-console-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-console:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy requests remotezip

      - name: Build real-imagery standalone
        run: python .assetgraph-lab/build_intelligence_console_v2.py

      - name: Validate standalone contract
        run: |
          test -s dist/ASSETGRAPH_INTELLIGENCE_CONSOLE_v2_REAL_IMAGERY.html
          test -s dist/assetgraph_console_v2_manifest.json
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/ASSETGRAPH_INTELLIGENCE_CONSOLE_v2_REAL_IMAGERY.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('data:image/jpeg;base64,') >= 35
          assert 'GROUND_TRUTH' in s
          assert 'MOTION_ANALYTICS_EXPERIMENTAL' in s
          assert 'PRIOR OBSERVATION RECOVERED' in s
          print({'bytes':p.stat().st_size,'embedded_jpegs':s.count('data:image/jpeg;base64,')})
          PY

      - name: Upload console artifact
        uses: actions/upload-artifact@v4
        with:
          name: assetgraph-intelligence-console-v2-real-imagery
          path: |
            dist/ASSETGRAPH_INTELLIGENCE_CONSOLE_v2_REAL_IMAGERY.html
            dist/assetgraph_console_v2_manifest.json
          if-no-files-found: error
          retention-days: 30

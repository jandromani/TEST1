name: AssetGraph Cycle 17B Apache Raw ONNX Parity

on:
  push:
    branches: [assetgraph-cycle17b-apache-onnx]
    paths:
      - '.assetgraph-lab/cycle17b_apache_onnx_protocol.json'
      - '.assetgraph-lab/apache_rtmdet_raw_onnx_ci.py'
      - '.github/workflows/assetgraph-cycle17b-apache-onnx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify frozen protocol
        run: |
          python - <<'PY'
          import json, hashlib
          p='.assetgraph-lab/cycle17b_apache_onnx_protocol.json'; b=open(p,'rb').read(); x=json.loads(b)
          assert x['source']['commit']=='3ff004eb21ea040455b5585db229edba4037f1bf'
          assert x['parity_gate']['cosine_min']==0.9999
          assert x['parity_gate']['p99_abs_diff_max']==0.002
          assert x['anti_leakage']['transset_access'] is False
          assert x['anti_leakage']['uavobb_training'] is False
          print({'protocol_sha256':hashlib.sha256(b).hexdigest(),'gate':x['parity_gate']})
          PY
      - name: Install exact Apache runtime and ONNX transport stack
        run: |
          python -m pip install --upgrade 'pip<26' wheel setuptools
          printf 'numpy==1.26.4\nopencv-python-headless==4.10.0.84\n' >/tmp/c17b-constraints.txt
          pip install -c /tmp/c17b-constraints.txt numpy==1.26.4 opencv-python-headless==4.10.0.84
          pip install -c /tmp/c17b-constraints.txt torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -c /tmp/c17b-constraints.txt mmengine==0.10.7 mmdet==3.2.0
          pip install -c /tmp/c17b-constraints.txt mmcv==2.1.0 -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.0/index.html
          pip install -c /tmp/c17b-constraints.txt onnx==1.16.2 onnxruntime==1.18.1
          python - <<'PY'
          import numpy, cv2, torch, onnx, onnxruntime
          assert numpy.__version__=='1.26.4'
          print({'numpy':numpy.__version__,'cv2':cv2.__version__,'torch':torch.__version__,'onnx':onnx.__version__,'ort':onnxruntime.__version__})
          PY
      - name: Checkout exact Apache MMRotate source
        run: |
          git clone --filter=blob:none https://github.com/open-mmlab/mmrotate.git /tmp/mmrotate17b
          git -C /tmp/mmrotate17b checkout --detach 3ff004eb21ea040455b5585db229edba4037f1bf
          test "$(git -C /tmp/mmrotate17b rev-parse HEAD)" = '3ff004eb21ea040455b5585db229edba4037f1bf'
          grep -q 'Apache License' /tmp/mmrotate17b/LICENSE
          pip install -c /tmp/c17b-constraints.txt -v -e /tmp/mmrotate17b
          python - <<'PY'
          import numpy
          assert numpy.__version__=='1.26.4', numpy.__version__
          PY
      - name: Acquire exact checkpoint and official real image
        run: |
          mkdir -p /tmp/assetgraph17b
          curl -L --fail --retry 3 -o /tmp/assetgraph17b/rtmdet_tiny.pth https://download.openmmlab.com/mmrotate/v1.0/rotated_rtmdet/rotated_rtmdet_tiny-3x-dota/rotated_rtmdet_tiny-3x-dota-9d821076.pth
          curl -L --fail --retry 3 -o /tmp/assetgraph17b/demo.jpg https://raw.githubusercontent.com/open-mmlab/mmrotate/3ff004eb21ea040455b5585db229edba4037f1bf/demo/demo.jpg
          echo '081a74b2c84407347c7b62b45a8647c70a816452027aaf2e0d6cefae3a2b6e9d  /tmp/assetgraph17b/rtmdet_tiny.pth' | sha256sum -c -
          test -s /tmp/assetgraph17b/demo.jpg
      - name: Export raw network and score PyTorch vs ONNX Runtime
        env:
          MMROTATE_DIR: /tmp/mmrotate17b
          RTMDET_CKPT: /tmp/assetgraph17b/rtmdet_tiny.pth
          RTMDET_IMAGE: /tmp/assetgraph17b/demo.jpg
        run: python .assetgraph-lab/apache_rtmdet_raw_onnx_ci.py
      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          p='.assetgraph-lab/evidence/cycle17b_apache_raw_onnx_parity.json'; x=json.load(open(p))
          assert x['schema']=='assetgraph-evidence/apache-raw-onnx-parity-v1'
          assert x['source']['license_detected']=='Apache-2.0'
          assert x['transset_accessed'] is False
          assert x['uavobb_training_performed'] is False
          assert x['postprocess_included'] is False
          assert x['nms_included'] is False
          assert x['gates']['raw_onnx_parity_pass'] is True
          print({'onnx':x['onnx'],'parity':{k:v for k,v in x['parity'].items() if k!='per_output'},'gates':x['gates']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: assetgraph-cycle17b-apache-raw-onnx
          path: |
            .assetgraph-lab/evidence/cycle17b_apache_raw_onnx_parity.json
            .assetgraph-lab/evidence/rtmdet_r_tiny_raw_1024.onnx

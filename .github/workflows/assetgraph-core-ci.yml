name: AssetGraph Core CI

on:
  push:
    branches: [assetgraph-core-v0]
    paths:
      - 'assetgraph-core/**'
      - '.github/workflows/assetgraph-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assetgraph-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core
        run: pip install -e '.[dev]'
      - name: Compile package
        run: python -m compileall -q src
      - name: Run product-core tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          assetgraph status --json
          python - <<'PY'
          import json
          for p in ['registries/capabilities.json','registries/runtimes.json','registries/datasets.json']:
              x=json.load(open(p)); assert x.get('schema'); print(p, 'OK')
          PY
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: assetgraph-core-v0-dist
          path: |
            assetgraph-core/dist/*
            assetgraph-core/registries/*.json
            assetgraph-core/README.md

name: AssetGraph Cycle 06 Lab

on:
  push:
    branches: [assetgraph-cycle06-lab]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ultralytics>=8.3,<9' scipy numpy pillow huggingface_hub
      - name: Run Memory v3 external lockbox
        continue-on-error: true
        run: python .assetgraph-lab/memory_v3_ci.py
      - name: Run overhead detector tournament
        continue-on-error: true
        run: python .assetgraph-lab/overhead_tournament_ci.py
      - name: Build SeaDronesSee CC0 evidence cube
        continue-on-error: true
        run: python .assetgraph-lab/seadronessee_cube_ci.py
      - name: Write Cycle 06 summary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('.assetgraph-lab/evidence');summary={}
          for p in root.glob('*.json'):
              try:
                  d=json.loads(p.read_text());summary[p.name]={'pass_rule':d.get('pass_rule',d.get('result',{}).get('pass_rule')),'metrics':d.get('metrics',d.get('result',{}).get('metrics')),'winner':d.get('winner')}
              except Exception as e:summary[p.name]={'error':str(e)}
          cube=root/'seadronessee_cc0_cube'/'cube_manifest.json'
          if cube.exists():
              d=json.loads(cube.read_text());summary['seadronessee_cube']={'frames':len(d['frames']),'distribution_status':d['distribution_status']}
          (root/'cycle06_summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          PY
      - name: Upload AssetGraph Cycle 06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetgraph-cycle06-evidence
          path: .assetgraph-lab/evidence
          if-no-files-found: warn

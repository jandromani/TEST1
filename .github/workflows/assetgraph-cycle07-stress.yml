name: AssetGraph Cycle 07 Stress

on:
  push:
    branches: [assetgraph-cycle07-stress]
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stress dependencies
        run: pip install 'ultralytics>=8.3,<9' scipy numpy pillow remotezip huggingface_hub
      - name: Run SeaDronesSee frozen structural stress test
        continue-on-error: true
        run: python .assetgraph-lab/seadronessee_stress_ci.py
      - name: Probe current Europe PMC UAV-OBB assets
        continue-on-error: true
        run: python .assetgraph-lab/europepmc_uavobb_probe_ci.py
      - name: Upload Cycle 07 stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assetgraph-cycle07-stress-evidence
          path: .assetgraph-lab/evidence
          if-no-files-found: warn
